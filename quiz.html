            background: #e2e8f0;

        }

        .option.correct {

        }

        .option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;

        #prevBtn {

        #nextBtn {

            font-weight: bold;
            margin: 20px;
            color: #16a34a;
        }

        #restartBtn {
            background: #2563eb;
            color: white;
        }

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 10px;
            }

                padding: 18px;

    // =========================
    // VARIABLES
    // =========================

    let currentQuestion = 0;

    let selectedAnswers = new Array(questions.length).fill(null);
    
    let studentClass = "";
let studentSubject = "";
    
    function getStudentName() {
    const name = document.getElementById("studentName").value.trim();

    if (name === "") {
        alert("Please enter the student's name.");
        return false;
    }

    return true;
}

function startTest() {

    const name = document.getElementById("studentNameStart").value.trim();
    const selectedClass = document.getElementById("classSelect").value;
    const selectedSubject = document.getElementById("subjectSelect").value;

studentClass = selectedClass;
studentSubject = selectedSubject;

    if (name === "") {
        alert("Please enter the student's name.");
        return;
    }

    if (selectedClass === "") {
        alert("Please select a class.");
        return;
    }

    if (selectedSubject === "") {
        alert("Please select a subject.");
        return;
    }

    // Save student information
    document.getElementById("studentName").value = name;

    // Hide the start screen
    document.getElementById("startScreen").style.display = "none";

    // Show the quiz
    document.getElementById("quizBox").style.display = "block";

    // Start from Question 1
    currentQuestion = 0;
    selectedAnswers = new Array(questions.length).fill(null);

    loadQuestion();
}


    // =========================
    // LOAD QUESTION
    // =========================

    function loadQuestion() {

        const q = questions[currentQuestion];

        document.getElementById("progress").innerText =
            "Question " + (currentQuestion + 1) +
            " of " + questions.length;

        document.getElementById("question").innerText =
            q.question;

        const optionsDiv =
            document.getElementById("options");

        optionsDiv.innerHTML = "";


        q.options.forEach((option, index) => {

            const label = document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${selectedAnswers[currentQuestion] === index ? "checked" : ""}
                    onchange="selectAnswer(${index})"
                >
                ${option}
            `;

            optionsDiv.appendChild(label);

        });


        // Previous button

        if (currentQuestion === 0) {
            document.getElementById("prevBtn").style.visibility =
                "hidden";
        } else {
            document.getElementById("prevBtn").style.visibility =
                "visible";
        }


        // Next / Submit button

        if (currentQuestion === questions.length - 1) {

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("submitBtn").style.display =
                "block";

        } else {

            document.getElementById("nextBtn").style.display =
                "block";

            document.getElementById("submitBtn").style.display =
                "none";
        }

    }


    // =========================
    // SELECT ANSWER
    // =========================

    function selectAnswer(answer) {

        selectedAnswers[currentQuestion] = answer;

    }


    // =========================
    // NEXT QUESTION
    // =========================

    function nextQuestion() {

        if (currentQuestion < questions.length - 1) {

            currentQuestion++;

            loadQuestion();

        }

    }


    // =========================
    // PREVIOUS QUESTION
    // =========================

    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            loadQuestion();

        }

    }


    // =========================
    // SUBMIT QUIZ
    // =========================

    function submitQuiz() {
    
    if (!getStudentName()) {
    return;
}

    let score = 0;

    let reviewHTML = "";

    questions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        if (selected === question.answer) {
            score++;
        }

        let selectedText =
            selected === null
            ? "Not Answered"
            : question.options[selected];

        let correctText =
            question.options[question.answer];

        let status =
            selected === question.answer
            ? "✅ Correct"
            : "❌ Wrong";

        reviewHTML += `
            <div class="review-question">

                <h3>Q${index + 1}. ${question.question}</h3>

                <p>
                    <strong>Your Answer:</strong>
                    ${selectedText}
                </p>

                <p>
                    <strong>Correct Answer:</strong>
                    ${correctText}
                </p>

                <p class="status">
                    ${status}
                </p>

            </div>
        `;
    });


    const percentage =
        Math.round((score / questions.length) * 100);


    document.getElementById("quizBox").style.display =
        "none";
        
        const studentName = document.getElementById("studentName").value.trim();

document.getElementById("studentResult").innerText =
    "Student Name: " + studentName;

    document.getElementById("result").style.display =
        "block";


    document.getElementById("score").innerText =
        score + " / " + questions.length;


    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "%";
        
        


    document.getElementById("answerReview").innerHTML =
        reviewHTML;
}


    // =========================
    // RESTART QUIZ
    // =========================

function endTest() {

if (!getStudentName()) {
    return;
}

    let confirmEnd = confirm(
        "Are you sure you want to end the test?"
    );

    if (!confirmEnd) {
        return;
    }

    // Calculate result
    let score = 0;
    let attempted = 0;

    questions.forEach((question, index) => {

        if (selectedAnswers[index] !== null) {
            attempted++;
        }

        if (
            question.answer !== null &&
            selectedAnswers[index] === question.answer
        ) {
            score++;
        }
    });

    let percentage = Math.round(
        (score / questions.length) * 100
    );

    // Hide quiz
    document.getElementById("quizBox").style.display = "none";
    
    const studentName = document.getElementById("studentName").value.trim();

document.getElementById("studentResult").innerText =
    "Student Name: " + studentName;

    // Show result
    document.getElementById("result").style.display = "block";

    // Show score
    document.getElementById("score").innerText =
        score + " / " + questions.length;

    // Show percentage and attempted questions
    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "% | Attempted: " +
        attempted + " / " + questions.length;

    // Show answer review
    showAnswerReview();
}

    let reviewHTML = "";

    questions.forEach((question, index) => {

        let selected = selectedAnswers[index];

        let yourAnswer =
            selected === null
            ? "Not Answered"
            : question.options[selected];

        let correctAnswer =
            question.answer === null
            ? "Answer not available"
            : question.options[question.answer];

        let status;

        if (selected === null) {

            status = "⚪ Not Answered";

        } else if (
            question.answer !== null &&
            selected === question.answer
        ) {

            status = "✅ Correct";

        } else {

            status = "❌ Wrong";
        }

        reviewHTML += `
            <div class="review-question">

                <h3>Q${index + 1}. ${question.question}</h3>

function downloadPDF() {
    const { jsPDF } = window.jspdf;

    const studentName =
        document.getElementById("studentName").value.trim();

    const scoreText =
        document.getElementById("score").innerText;

    const percentageText =
        document.getElementById("percentage").innerText;

    // Calculate correct, wrong and unattempted answers
    let correct = 0;
    let attempted = 0;

    questions.forEach((question, index) => {
        if (selectedAnswers[index] !== null) {
            attempted++;

            if (selectedAnswers[index] === question.answer) {
                correct++;
            }
        }
    });

    const totalQuestions = questions.length;
    const wrong = attempted - correct;
    const unattempted = totalQuestions - attempted;

    const date = new Date().toLocaleDateString();

    const doc = new jsPDF();

    // Title
    doc.text(studentClass + " " + studentSubject + " Quiz", 105, 20, {
    align: "center"
});

doc.text("Subject: " + studentSubject, 20, 60);
doc.text("Date: " + date, 20, 70);

    // Result heading
    doc.setFontSize(15);
    doc.text("Result Summary", 20, 70);

    // Result details
    doc.setFontSize(12);

    doc.text("Total Questions: " + totalQuestions, 25, 85);
    doc.text("Attempted: " + attempted, 25, 95);

    doc.text("Wrong Answers: " + wrong, 25, 115);
    doc.text("Unattempted: " + unattempted, 25, 125);
    doc.text("Score: " + scoreText, 25, 135);
