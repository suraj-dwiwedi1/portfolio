        function downloadAnswerSheet() {

    let answerHTML = `
        <html>
        <head>
            <title>Answer Sheet</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 30px;
                }

                h1 {
                    text-align: center;
                }

                .student-info {
                    margin-bottom: 20px;
                }

                .question {
                    margin-bottom: 15px;
                    padding: 10px;
                    border-bottom: 1px solid #ddd;
                }
            </style>
        </head>
        <body>

        <h1>Answer Sheet</h1>

        <div class="student-info">
            <strong>Student Name:</strong>
            ${document.getElementById("studentName").value}
            <br><br>

            <strong>Class:</strong>
            ${studentClass}
            <br><br>

            <strong>Subject:</strong>
            ${studentSubject}
        </div>
    `;

    questions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        const yourAnswer =
            selected === null
                ? "Not Answered"
                : question.options[selected];

        const correctAnswer =
            question.options[question.answer];

        answerHTML += `
            <div class="question">
                <strong>Q${index + 1}. ${question.question}</strong>
                <p>Your Answer: ${yourAnswer}</p>
                <p>Correct Answer: ${correctAnswer}</p>
            </div>
        `;
    });

    answerHTML += `
        </body>
        </html>
    `;

    const blob = new Blob([answerHTML], {
        type: "text/html"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "Answer_Sheet.html";
    link.click();

    URL.revokeObjectURL(url);
}
        
    </script>

    function getStudentName() {

function startTest() {

    const name = document.getElementById("studentNameStart").value.trim();
    const selectedClass = document.getElementById("classSelect").value;
    const selectedSubject = document.getElementById("subjectSelect").value;

studentClass = selectedClass;
studentSubject = selectedSubject;

    if (name === "") {
        alert("Please enter the student's name.");
        return;
    }

    if (selectedClass === "") {
        alert("Please select a class.");
        return;
    }

    if (selectedSubject === "") {
        alert("Please select a subject.");
        return;
    }

    // Save student information
    document.getElementById("studentName").value = name;

    // Hide the start screen
    document.getElementById("startScreen").style.display = "none";

    // Show the quiz
    document.getElementById("quizBox").style.display = "block";

    // Start from Question 1
    currentQuestion = 0;
    selectedAnswers = new Array(questions.length).fill(null);

    loadQuestion();
}


    // =========================
    // LOAD QUESTION
    // =========================

    function loadQuestion() {

        const q = questions[currentQuestion];

        document.getElementById("progress").innerText =
            "Question " + (currentQuestion + 1) +
            " of " + questions.length;

        document.getElementById("question").innerText =
            q.question;

        const optionsDiv =
            document.getElementById("options");

        optionsDiv.innerHTML = "";


        q.options.forEach((option, index) => {

            const label = document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${selectedAnswers[currentQuestion] === index ? "checked" : ""}
                    onchange="selectAnswer(${index})"
                >
                ${option}
            `;

            optionsDiv.appendChild(label);

        });


        // Previous button

        if (currentQuestion === 0) {
            document.getElementById("prevBtn").style.visibility =
                "hidden";
        } else {
            document.getElementById("prevBtn").style.visibility =
                "visible";
        }


        // Next / Submit button

        if (currentQuestion === questions.length - 1) {

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("submitBtn").style.display =
                "block";

        } else {

            document.getElementById("nextBtn").style.display =
                "block";

            document.getElementById("submitBtn").style.display =
                "none";
        }

    }


    // =========================
    // SELECT ANSWER
    // =========================

    function selectAnswer(answer) {

        selectedAnswers[currentQuestion] = answer;

    }


    // =========================
    // NEXT QUESTION
    // =========================

    function nextQuestion() {

        if (currentQuestion < questions.length - 1) {

            currentQuestion++;

            loadQuestion();

        }

    }


    // =========================
    // PREVIOUS QUESTION
    // =========================

    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            loadQuestion();

        }

    }

    function submitQuiz() {
    
    if (!getStudentName()) {
    return;
}

    let reviewHTML = "";

    questions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        if (selected === question.answer) {
            score++;
        }

        let selectedText =
            selected === null
            ? "Not Answered"
            : question.options[selected];

        let correctText =
            question.options[question.answer];

        let status =
            selected === question.answer
            ? "✅ Correct"
            : "❌ Wrong";

        reviewHTML += `
            <div class="review-question">

                <h3>Q${index + 1}. ${question.question}</h3>

                <p>
                    <strong>Your Answer:</strong>
                    ${selectedText}
                </p>

                <p>
                    <strong>Correct Answer:</strong>
                    ${correctText}
                </p>

                <p class="status">
                    ${status}
                </p>

            </div>
        `;
    });


    const percentage =
        Math.round((score / questions.length) * 100);

        "none";

function endTest() {

if (!getStudentName()) {
    return;
}

    let confirmEnd = confirm(
        "Are you sure you want to end the test?"
    );

    if (!confirmEnd) {
        return;
    }

    // Calculate result
    let score = 0;
    let attempted = 0;

    questions.forEach((question, index) => {

        if (selectedAnswers[index] !== null) {
            attempted++;
        }

        if (
            question.answer !== null &&
            selectedAnswers[index] === question.answer
        ) {
            score++;
        }
    });

    let percentage = Math.round(
        (score / questions.length) * 100
    );

    // Hide quiz
    document.getElementById("quizBox").style.display = "none";
    
    const studentName = document.getElementById("studentName").value.trim();

document.getElementById("studentResult").innerText =
    "Student Name: " + studentName;

    // Show result
    document.getElementById("result").style.display = "block";

    // Show score
    document.getElementById("score").innerText =
        score + " / " + questions.length;

    // Show percentage and attempted questions
    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "% | Attempted: " +
        attempted + " / " + questions.length;

}

function showAnswerReview() {

    let reviewHTML = "";

    questions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        const yourAnswer =
            selected === null
                ? "Not Answered"
                : question.options[selected];

        const correctAnswer =
            question.options[question.answer];

        let status;

        if (selected === null) {
            status = "⚪ Not Answered";
        } 
        else if (selected === question.answer) {
            status = "✅ Correct";
        } 
        else {
            status = "❌ Wrong";
        }

        reviewHTML += `
            <div class="review-question">

                <h3>Q${index + 1}. ${question.question}</h3>

                <p>
                    <strong>Your Answer:</strong>
                    ${yourAnswer}
                </p>

                <p>
                    <strong>Correct Answer:</strong>
                    ${correctAnswer}
                </p>

                <p class="status">
                    ${status}
                </p>

            </div>
        `;
    });

    document.getElementById("answerReview").innerHTML = reviewHTML;
}
    
    
    function toggleAnswers() {

    const answerReview = document.getElementById("answerReview");
    const button = document.getElementById("showAnswersBtn");

    if (answerReview.style.display === "none" ||
        answerReview.style.display === "") {

        showAnswerReview();

        answerReview.style.display = "block";
        button.innerText = "Hide Answers";

    } else {

        answerReview.style.display = "none";
        button.innerText = "Show Answers";
    }
}

function downloadAnswerSheet() {

    const { jsPDF } = window.jspdf;

    const studentName =
        document.getElementById("studentName").value.trim();

    const doc = new jsPDF();

    let y = 20;

    // Title
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);

    doc.text(
        studentSubject + " - Answer Sheet",
        105,
        y,
        { align: "center" }
    );

    y += 12;

    // Student information
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");

    doc.text("Student Name: " + studentName, 15, y);
    y += 7;

    doc.text("Class: " + studentClass, 15, y);
    y += 7;

    doc.text("Subject: " + studentSubject, 15, y);
    y += 12;

    // Line
    doc.line(15, y, 195, y);
    y += 10;

    // Questions
    questions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        const yourAnswer =
            selected === null
                ? "Not Answered"
                : question.options[selected];

        const correctAnswer =
            question.options[question.answer];

        // Question
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);

        const questionText =
            "Q" + (index + 1) + ". " + question.question;

        const questionLines =
            doc.splitTextToSize(questionText, 175);

        // Check page space
        if (y + questionLines.length * 5 + 25 > 285) {
            doc.addPage();
            y = 20;
        }

        doc.text(questionLines, 15, y);

        y += questionLines.length * 5 + 5;

        // Your answer
        doc.setFont("helvetica", "normal");

        const yourText =
            "Your Answer: " + yourAnswer;

        const yourLines =
            doc.splitTextToSize(yourText, 175);

        doc.text(yourLines, 20, y);

        y += yourLines.length * 5 + 4;

        // Correct answer
        const correctText =
            "Correct Answer: " + correctAnswer;

        const correctLines =
            doc.splitTextToSize(correctText, 175);

        doc.text(correctLines, 20, y);

        y += correctLines.length * 5 + 8;
    });

    // Save PDF
    const safeName = studentName
        ? studentName.replace(/\s+/g, "_")
        : "Student";

    const fileName =
        safeName + "_Answer_Sheet.pdf";

    doc.save(fileName);
}
