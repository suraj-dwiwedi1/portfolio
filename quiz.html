    // =========================

    let currentQuestion = 0;

    let selectedAnswers = new Array(questions.length).fill(null);
    
    let studentClass = "";
let studentSubject = "";
    
    function getStudentName() {
    const name = document.getElementById("studentName").value.trim();

    if (name === "") {
        alert("Please enter the student's name.");
        return false;
    }

    return true;
}

function startTest() {

    const name = document.getElementById("studentNameStart").value.trim();
    const selectedClass = document.getElementById("classSelect").value;
    const selectedSubject = document.getElementById("subjectSelect").value;

studentClass = selectedClass;
studentSubject = selectedSubject;

    if (name === "") {
        alert("Please enter the student's name.");
        return;
    }

    if (selectedClass === "") {
        alert("Please select a class.");
        return;
    }

    if (selectedSubject === "") {
        alert("Please select a subject.");
        return;
    }

    // Save student information
    document.getElementById("studentName").value = name;

    // Hide the start screen
    document.getElementById("startScreen").style.display = "none";

    // Show the quiz
    document.getElementById("quizBox").style.display = "block";

    // Start from Question 1
    currentQuestion = 0;
    selectedAnswers = new Array(questions.length).fill(null);

    loadQuestion();
}


    // =========================
    // LOAD QUESTION
    // =========================

    function loadQuestion() {

        const q = questions[currentQuestion];

        document.getElementById("progress").innerText =
            "Question " + (currentQuestion + 1) +
            " of " + questions.length;

        document.getElementById("question").innerText =
            q.question;

        const optionsDiv =
            document.getElementById("options");

        optionsDiv.innerHTML = "";


        q.options.forEach((option, index) => {

            const label = document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${selectedAnswers[currentQuestion] === index ? "checked" : ""}
                    onchange="selectAnswer(${index})"
                >
                ${option}
            `;

            optionsDiv.appendChild(label);

        });


        // Previous button

        if (currentQuestion === 0) {
            document.getElementById("prevBtn").style.visibility =
                "hidden";
        } else {
            document.getElementById("prevBtn").style.visibility =
                "visible";
        }


        // Next / Submit button

        if (currentQuestion === questions.length - 1) {

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("submitBtn").style.display =
                "block";

        } else {

            document.getElementById("nextBtn").style.display =
                "block";

            document.getElementById("submitBtn").style.display =
                "none";
        }

    }


    // =========================
    // SELECT ANSWER
    // =========================

    function selectAnswer(answer) {

        selectedAnswers[currentQuestion] = answer;

    }


    // =========================
    // NEXT QUESTION
    // =========================

    function nextQuestion() {

        if (currentQuestion < questions.length - 1) {

            currentQuestion++;

            loadQuestion();

        }

    }


    // =========================
    // PREVIOUS QUESTION
    // =========================

    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            loadQuestion();

        }

    }


    // =========================
    // SUBMIT QUIZ
    // =========================

    function submitQuiz() {
    
    if (!getStudentName()) {
    return;
}

    let score = 0;

    let reviewHTML = "";

    questions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        if (selected === question.answer) {
            score++;
        }

        let selectedText =
            selected === null
            ? "Not Answered"
            : question.options[selected];

        let correctText =
            question.options[question.answer];

        let status =
            selected === question.answer
            ? "✅ Correct"
            : "❌ Wrong";

        reviewHTML += `
            <div class="review-question">

                <h3>Q${index + 1}. ${question.question}</h3>

                <p>
                    <strong>Your Answer:</strong>
                    ${selectedText}
                </p>

                <p>
                    <strong>Correct Answer:</strong>
                    ${correctText}
                </p>

                <p class="status">
                    ${status}
                </p>

            </div>
        `;
    });


    const percentage =
        Math.round((score / questions.length) * 100);


    document.getElementById("quizBox").style.display =
        "none";
        
        const studentName = document.getElementById("studentName").value.trim();

document.getElementById("studentResult").innerText =
    "Student Name: " + studentName;

    document.getElementById("result").style.display =
        "block";


    document.getElementById("score").innerText =
        score + " / " + questions.length;


    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "%";
        
        


    document.getElementById("answerReview").innerHTML =
        reviewHTML;
}


    // =========================
    // RESTART QUIZ
    // =========================

function endTest() {

if (!getStudentName()) {
    return;
}

    let confirmEnd = confirm(
        "Are you sure you want to end the test?"
    );

    if (!confirmEnd) {
        return;
    }

    // Calculate result
    let score = 0;
    let attempted = 0;

    questions.forEach((question, index) => {

        if (selectedAnswers[index] !== null) {
            attempted++;
        }

        if (
            question.answer !== null &&
            selectedAnswers[index] === question.answer
        ) {
            score++;
        }
    });

    let percentage = Math.round(
        (score / questions.length) * 100
    );

    // Hide quiz
    document.getElementById("quizBox").style.display = "none";
    
    const studentName = document.getElementById("studentName").value.trim();

document.getElementById("studentResult").innerText =
    "Student Name: " + studentName;

    // Show result
    document.getElementById("result").style.display = "block";

    // Show score
    document.getElementById("score").innerText =
        score + " / " + questions.length;

    // Show percentage and attempted questions
    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "% | Attempted: " +
        attempted + " / " + questions.length;

    // Show answer review
    showAnswerReview();
}

            question.answer === null
            ? "Answer not available"
            : question.options[question.answer];

            status = "⚪ Not Answered";

            question.answer !== null &&
            selected === question.answer
        ) {

            status = "✅ Correct";

function downloadPDF() {
    const { jsPDF } = window.jspdf;

    const studentName = document.getElementById("studentName").value.trim();
    const totalQuestions = questions.length;

    let correct = 0;
    let attempted = 0;

    questions.forEach((q, index) => {
        if (selectedAnswers[index] !== null) {
            attempted++;

            if (selectedAnswers[index] === q.answer) {
                correct++;
            }
        }
    });

    const wrong = attempted - correct;
    const unattempted = totalQuestions - attempted;

    const score = correct;
    const percentage = Math.round((correct / totalQuestions) * 100);

    // Calculate grade
    let grade;

    if (percentage >= 90) {
        grade = "A";
    } else if (percentage >= 75) {
        grade = "B";
    } else if (percentage >= 50) {
        grade = "C";
    } else {
        grade = "D";
    }

    const date = new Date().toLocaleDateString();

    const doc = new jsPDF();

    // Border
    doc.setLineWidth(1);
    doc.rect(10, 10, 190, 277);

    // Main Heading
    doc.setFontSize(22);
    doc.setFont("helvetica", "bold");
    doc.text("QUIZ REPORT", 105, 28, { align: "center" });

    // Student information
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");

    doc.text("Student Name: " + studentName, 20, 45);
    doc.text("Class: " + studentClass, 20, 55);
    doc.text("Subject: " + studentSubject, 20, 65);
    doc.text("Date: " + date, 130, 45);

    // Horizontal line
    doc.line(20, 72, 190, 72);

    // Result heading
    doc.setFontSize(16);
    doc.setFont("helvetica", "bold");
    doc.text("RESULT", 105, 85, { align: "center" });

    // Result table
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");

    doc.text("Total Questions", 25, 100);
    doc.text(String(totalQuestions), 160, 100);

    doc.text("Attempted", 25, 112);
    doc.text(String(attempted), 160, 112);

    doc.text("Correct Answer", 25, 124);
    doc.text(String(correct), 160, 124);

    doc.text("Wrong Answer", 25, 136);
    doc.text(String(wrong), 160, 136);

    doc.text("Unattempted", 25, 148);
    doc.text(String(unattempted), 160, 148);

    doc.text("Score", 25, 160);
    doc.text(score + " / " + totalQuestions, 160, 160);

    doc.text("Percentage", 25, 172);
    doc.text(percentage + "%", 160, 172);

    doc.text("Grade", 25, 184);

    doc.setFont("helvetica", "bold");
    doc.text(grade, 160, 184);

    // Separator
    doc.line(20, 193, 190, 193);

    // Grading System
    doc.setFontSize(14);
    doc.text("GRADING SYSTEM", 20, 207);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");

    doc.text("A - Superior", 25, 219);
    doc.text("B - Above Average", 25, 229);
    doc.text("C - Average", 100, 219);
    doc.text("D - Below Average", 100, 229);

    // Remarks
    doc.setFontSize(14);
    doc.setFont("helvetica", "bold");
    doc.text("REMARKS", 20, 244);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("______________________________________________", 20, 253);
    doc.text("______________________________________________", 20, 261);

    // Teacher / Parents
    doc.text("Teacher: ____________________", 20, 273);
    doc.text("Parents: ____________________", 120, 273);

    // File name
    const safeName = studentName
        ? studentName.replace(/\s+/g, "_")
        : "Student";

    const fileName =
        safeName + "_" + studentSubject + "_Quiz_Report.pdf";

    doc.save(fileName);
}
