<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            width: 300px;
        }

        #display {
            width: 100%;
            height: 60px;

            font-size: 25px;
            text-align: right;

            margin-bottom: 15px;
            padding: 10px;

            box-sizing: border-box;
        }

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 55px;
            font-size: 20px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .operator {
            background-color: #00adb5;
            color: white;
        }

        .equal {
            background-color: #28a745;
            color: white;
        }

        .clear {
            background-color: #dc3545;
            color: white;
        }

    </style>
</head>


<body>

    <div class="calculator">

        <input type="text"
               id="display"
               value="0"
               readonly>


        <div class="buttons">

            <button class="clear"
                    onclick="clearDisplay()">
                C
            </button>

            <button onclick="deleteLast()">
                DEL
            </button>

            <button class="operator"
                    onclick="addValue('%')">
                %
            </button>

            <button class="operator"
                    onclick="addValue('/')">
                ÷
            </button>


            <button onclick="addValue('7')">
                7
            </button>

            <button onclick="addValue('8')">
                8
            </button>

            <button onclick="addValue('9')">
                9
            </button>

            <button class="operator"
                    onclick="addValue('*')">
                ×
            </button>


            <button onclick="addValue('4')">
                4
            </button>

            <button onclick="addValue('5')">
                5
            </button>

            <button onclick="addValue('6')">
                6
            </button>

            <button class="operator"
                    onclick="addValue('-')">
                −
            </button>


            <button onclick="addValue('1')">
                1
            </button>

            <button onclick="addValue('2')">
                2
            </button>

            <button onclick="addValue('3')">
                3
            </button>

            <button class="operator"
                    onclick="addValue('+')">
                +
            </button>


            <button onclick="addValue('0')">
                0
            </button>

            <button onclick="addValue('.')">
                .
            </button>

            <button class="equal"
                    onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <script>

        let display =
            document.getElementById("display");


        function addValue(value) {

            if (display.value === "0") {
                display.value = value;
            }

            else {
                display.value += value;
            }
        }


        function clearDisplay() {

            display.value = "0";

        }


        function deleteLast() {

            display.value =
                display.value.slice(0, -1);

            if (display.value === "") {
                display.value = "0";
            }

        }


        function calculate() {

            try {

                display.value =
                    Function(
                        "return " +
                        display.value
                    )();

            }

            catch {

                display.value = "Error";

            }

        }

    </script>

</body>

</html>
